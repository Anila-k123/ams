      <div class="toolbar"><div class="seg" data-seg="scope" role="group" aria-label="Forums">
        <button data-v="mine" aria-pressed="${P2DB.scope === 'mine'}">My forums (${D.displayBoard.length})</button>
        <button data-v="all" aria-pressed="${P2DB.scope === 'all'}">All forums (${all})</button></div></div>
      ${boards.map((b, i) => {
        const yours = b.rows.filter(r => r.yours != null).length;
        return `<details class="pp-acc" data-acc="${esc(b.court)}" ${P2DB.closed.has(b.court) ? '' : 'open'}>
          <summary>${I('chevron', 'sm chev')}<h3 class="grow">${esc(b.court)}</h3><span class="faint small">${b.rows.length} halls${yours ? `, ${yours} with your matters` : ''}</span></summary>
          ${b.error && P2DB.scError ? `<div style="padding:0 var(--s5) var(--s4)"><div class="callout bad" role="alert">${I('warn', 'sm')}<div class="grow">Couldn't reach the Supreme Court board. Showing data from 10:42.</div><button class="btn sm" id="db-retry">Retry</button></div></div>` : ''}

    pg.querySelector('#db-refresh').onclick = (e) => busy(e.currentTarget, () => {
      const live = D.displayBoard.concat(P2DB.extra).flatMap(b => b.rows).filter(r => !r.over);

    pg.addEventListener('click', e => {
      const r = e.target.closest('#db-retry');

    });

   5. APPEAL ALERT: appeals found against our decided cases, for a human to verify.

page('/appeals', {
  title: 'Appeal alert', perm: 'CASE_EDIT', skeleton: 'table',
  render() {
    const nNew = D.appeals.filter(a => a.status === 'New').length;
    const dismissed = D.appeals.filter(a => a.status === 'Dismissed');
    return `<div id="pg-ap">
      <div class="page-head"><div><h1>Appeal alert</h1><p>Appeals filed in higher courts against your decided cases, found by the nightly court-record check. Verify before acting; no limitation period is calculated.</p></div></div>
      ${nNew ? '' : `<div class="panel" style="margin-bottom:var(--s4)">${emptyState({ icon: 'ok', title: 'No new appeals to review', text: 'The nightly check found nothing new. Confirmed matches stay listed below.' })}</div>`}
      <div id="ap-table"></div>
      <section class="panel" style="margin-top:var(--s6)"><div class="panel-head"><h3>Dismissed as unrelated</h3><span class="sub">${dismissed.length}</span></div>
        <div class="panel-body ${dismissed.length ? 'flush' : ''}">${dismissed.length ? `<div class="list">${dismissed.map(a => { const c = caseById(a.source); return `<div class="list-item"><div class="grow"><div class="small"><span class="mono">${esc(a.appealNo)}</span> <span class="faint">${esc(a.forum)}</span></div><div class="faint xs">${esc(a.parties)}. Matched to <span class="mono">${esc(c.no)}</span></div></div><button class="btn sm" data-restore="${a.id}">${I('restore', 'sm')}Restore</button></div>`; }).join('')}</div>` : '<p class="muted small">Nothing dismissed.</p>'}</div></section>
    </div>`;
  },
  mount(root) {
    const pg = root.querySelector('#pg-ap');
    DataTable(pg.querySelector('#ap-table'), {
      rowsFn: () => D.appeals.filter(a => a.status === 'New' || a.status === 'Confirmed'),
      initialSort: { key: 'matched', dir: 'desc' },
      empty: { icon: 'alert', title: 'No appeals found', text: 'Matches from the nightly check appear here.' },
      rowClass: (a) => a.status === 'New' ? 'hl' : '',
      columns: [
        { key: 'source', label: 'Your case', sort: (a) => caseById(a.source).no, render: (a) => { const c = caseById(a.source); return `<a class="mono link" href="#/cases/${c.id}">${esc(c.no)}</a><div class="cell-sub">${esc(c.title)}</div>`; } },
        { key: 'appealNo', label: 'Appeal found', render: (a) => `<span class="mono">${esc(a.appealNo)}</span>` },
        { key: 'forum', label: 'Forum', sort: true, hideSm: true },
        { key: 'parties', label: 'Parties', hideSm: true, render: (a) => `<span class="small">${esc(a.parties)}</span>` },
        { key: 'filed', label: 'Filed', sort: true, hideSm: true, render: (a) => fdate(a.filed) },
        { key: 'matched', label: 'Matched', sort: true, render: (a) => `<div class="small">${fdate(a.matched)}</div><div class="pp-score" title="Match score ${a.score} of 100"><div class="bar-track"><i style="width:${a.score}%;background:${a.score >= 80 ? 'var(--ink)' : 'var(--ink-3)'}"></i></div><span class="mono xs">${a.score}</span></div>` },
        { key: 'status', label: 'Status', sort: true, render: (a) => chip(a.status) },
        { key: 'act', label: '<span class="sr-only">Actions</span>', cls: 'actions', render: (a) => a.status === 'New' ? `<button class="btn sm primary" data-ap="confirm" data-id="${a.id}">It's an appeal</button> <button class="btn sm ghost" data-ap="dismiss" data-id="${a.id}">Not related</button>` : '<span class="faint xs">Verified</span>' },
      ],
    });
    pg.addEventListener('click', e => {
      const b = e.target.closest('[data-ap]');
      if (b) {
        const a = D.appeals.find(x => x.id === +b.dataset.id);
        a.status = b.dataset.ap === 'confirm' ? 'Confirmed' : 'Dismissed';
        refreshNav(); router();
        toast(a.status === 'Confirmed' ? `Marked <span class="mono">${esc(a.appealNo)}</span> as an appeal. Check the limitation and file your appearance.` : 'Dismissed as unrelated. You can restore it below.', a.status === 'Confirmed' ? 'ok' : 'info');
        return;
      }
      const r = e.target.closest('[data-restore]');
      if (r) { const a = D.appeals.find(x => x.id === +r.dataset.restore); a.status = 'New'; refreshNav(); router(); toast('Restored to the review list', 'ok'); }
    });
  },
});

  /* ---------- shared helpers ---------- */
  const redraw = () => router();
  const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
  const clientCases = (id) => D.cases.filter(c => c.client === +id);
  const outstanding = (id) => sum(clientCases(id), c => Math.max(0, c.fee - c.paid));
  const moreBtn = (id, label) => `<button class="btn ghost sm icon" data-pop data-more="${id}" aria-label="Actions for ${esc(label)}">${I('more', 'sm')}</button>`;
  const figures = (items) => `<div class="figures" style="margin-bottom:var(--s5)">${items.map(([lbl, val, meta, cls]) => `<div class="figure"><div class="lbl">${lbl}</div><div class="val ${cls || ''}">${val}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>`).join('')}</div>`;
  const barRows = (rows, color = 'var(--ink)') => { const max = Math.max(1, ...rows.map(r => r[1])); return rows.map(([l, v, disp]) => `<div class="bar-row"><span class="ellipsis" title="${esc(l)}">${esc(l)}</span><div class="bar-track" role="img" aria-label="${esc(l)}: ${esc(disp ?? v)}"><i style="width:${(v / max * 100).toFixed(1)}%;background:${color}"></i></div><span class="num right">${disp ?? v}</span></div>`).join(''); };
  const seg = (name, opts, cur, label) => `<div class="seg" data-seg="${name}" role="group" aria-label="${label}">${opts.map(([v, l]) => `<button data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('')}</div>`;
  const pageHead = (title, sub, actions) => `<div class="page-head"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="actions">${actions || ''}</div></div>`;
  const caseCell = (c) => c ? `<a class="link mono small" href="#/cases/${c.id}">${esc(c.no)}</a>` : '<span class="faint">None</span>';
  const tryPrint = () => { try { window.print(); } catch (e) { toast('Printing is blocked in this window. Use Download PDF instead.', 'warn'); } };
  /* Delegated "more" menus: rowsById maps data-more id to a row */
  const wireMore = (root, find, items) => root.addEventListener('click', e => { const b = e.target.closest('[data-more]'); if (!b) return; e.stopPropagation(); const r = find(b.dataset.more); if (r) popMenu(b, items(r)); });

  /* Effective invoice status: an unpaid invoice past its due date is overdue. */
  const invStatus = (i) => i.status === 'Unpaid' && daysFrom(i.due) < 0 ? 'Overdue' : i.status;

  /* Amount in words, Indian system (crore, lakh, thousand). */
  const ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = (n) => n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');
  const words = (n) => {
    n = Math.round(n); if (!n) return 'Zero';
    const cr = Math.floor(n / 1e7); n %= 1e7; const lk = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1e3); n %= 1e3; const h = Math.floor(n / 100); n %= 100;
    let s = '';
    if (cr) s += words(cr) + ' Crore '; if (lk) s += two(lk) + ' Lakh '; if (th) s += two(th) + ' Thousand '; if (h) s += ONES[h] + ' Hundred ';
    if (n) s += (s ? 'and ' : '') + two(n);
    return s.trim();
  };
  const rupeesInWords = (n) => 'Rupees ' + words(n) + ' only';

  /* ---------- shared dialogs ---------- */
  function portalDialog(c, after) {
    modal({
      title: 'Client portal access', sub: esc(c.name), size: 'narrow',
      body: `<div class="stack" style="gap:14px">
        <label class="switch"><input type="checkbox" id="pt-on" ${c.portal ? 'checked' : ''}> Portal access enabled</label>
        <table class="t"><thead><tr><th scope="col">Login</th><th scope="col">Status</th></tr></thead><tbody>
          <tr><td class="small">${esc(c.email)}</td><td>${c.portal ? chip('Active', 'ok') : chip('Off', '')}</td></tr></tbody></table>
        <p class="faint xs">The client sees their own cases, hearings, invoices and documents you mark as shared.</p></div>`,
      foot: `<button class="btn ghost" data-close>Close</button><button class="btn primary" id="pt-inv">${I('send', 'sm')}Send invite link (valid 72 hours)</button>`,
      onMount(el, close) {
        el.querySelector('#pt-on').onchange = (e) => { c.portal = e.target.checked; toast(c.portal ? `Portal enabled for ${esc(c.name)}` : `Portal access turned off for ${esc(c.name)}`, 'ok'); after && after(); };
        el.querySelector('#pt-inv').onclick = (e) => busy(e.currentTarget, () => { c.portal = true; close(); toast(`Invite link sent to ${esc(c.email)}. It expires in 72 hours.`, 'ok'); after && after(); });
      },
    });
  }
  const clientMenu = (c) => [
    { label: 'Open', icon: 'eye', onClick: () => go('/clients/' + c.id) },
    { label: 'Edit', icon: 'edit', onClick: () => FORMS.client(c, redraw) },
    { label: 'Portal logins', icon: 'key', onClick: () => portalDialog(c, redraw) },
    '-',
    c.archived
      ? { label: 'Restore', icon: 'restore', onClick: () => { c.archived = false; toast(`Restored ${esc(c.name)}`, 'ok'); redraw(); } }
      : { label: 'Archive', icon: 'archive', danger: true, onClick: () => confirmDialog({ title: 'Archive this client?', text: `${esc(c.name)} will be hidden from lists. Their cases, invoices and documents stay as they are. You can restore the client later.`, confirm: 'Archive client', danger: true, onConfirm: () => { c.archived = true; toast(`Archived ${esc(c.name)}`, 'ok', { action: { label: 'Show archived', href: '#/clients?archived=1' } }); redraw(); } }) },
  ];

  /* ==========================================================================
     /clients: client list
     ========================================================================== */
  let showArchived = false;
  page('/clients', {
    title: 'Clients', perm: 'CLIENT_VIEW', skeleton: 'table',
    render: () => `${pageHead('Clients', `${D.clients.filter(c => !c.archived).length} clients. Outstanding is unpaid fees across their matters.`, can('CLIENT_CREATE') ? `<button class="btn primary" id="cl-add">${I('plus', 'sm')}Add client</button>` : '')}<div id="cl-tbl"></div>`,
    mount(root) {
      if (query().get('archived')) showArchived = true;
      const add = root.querySelector('#cl-add'); if (add) add.onclick = () => FORMS.client(null, redraw);
      const advs = D.advocates.filter(a => a.role.includes('Advocate')).map(a => a.name);
      DataTable(root.querySelector('#cl-tbl'), {
        rowsFn: () => D.clients.filter(c => showArchived || !c.archived),
        search: { placeholder: 'Search name, phone, email or city', keys: ['name', 'phone', 'email', 'city', 'district'] },
        filters: [
          { label: 'Type', options: ['Individual', 'Company'], key: 'kind' },
          { label: 'Advocate', options: advs, test: (r, v) => (advById(r.advocate) || {}).name === v },
          { label: 'Portal', options: ['Enabled', 'Off'], test: (r, v) => (v === 'Enabled') === !!r.portal },
        ],
        toolbarExtra: `<button class="filter-chip" id="cl-arch" aria-pressed="${showArchived}">${I('archive', 'sm')}Show archived</button>`,
        columns: [
          { key: 'name', label: 'Client', sort: true, render: c => `<div class="row" style="gap:10px">${avatar(c.name, 'sm')}<div><div class="cell-title">${esc(c.name)}${c.archived ? ' ' + chip('Archived', '') : ''}</div><div class="cell-sub">${esc(c.kind)}</div></div></div>` },
          { key: 'phone', label: 'Contact', render: c => `<div class="small nowrap">${esc(c.phone)}</div><div class="cell-sub">${esc(c.email)}</div>`, hideSm: true },
          { key: 'city', label: 'Location', sort: true, render: c => `${esc(c.city)}<div class="cell-sub">${esc(c.district)}</div>`, hideSm: true },
          { key: 'advocate', label: 'Handling advocate', sort: c => (advById(c.advocate) || {}).name, render: c => esc((advById(c.advocate) || {}).name || '—'), hideSm: true },
          { key: 'm', label: 'Matters', cls: 'amt', sort: c => clientCases(c.id).filter(x => x.status !== 'Closed').length, render: c => `<span class="num">${clientCases(c.id).filter(x => x.status !== 'Closed').length}</span>` },
          { key: 'o', label: 'Outstanding', cls: 'amt', sort: c => outstanding(c.id), render: c => { const o = outstanding(c.id); return `<span class="mono">${o ? inr(o) : '<span class="faint">Nil</span>'}</span>`; } },
          { key: 'portal', label: 'Portal', render: c => c.portal ? chip('Enabled', 'ok') : chip('Off', ''), hideSm: true },
          { key: 'a', label: '<span class="sr-only">Actions</span>', cls: 'actions', render: c => moreBtn(c.id, c.name) },
        ],
        initialSort: { key: 'name', dir: 'asc' },
        onRow: c => go('/clients/' + c.id),
        empty: { icon: 'users', title: 'No clients yet', text: 'Add your first client to open matters and raise invoices.' },
      });
      const chipBtn = root.querySelector('#cl-arch');
      chipBtn.onclick = () => { showArchived = !showArchived; redraw(); };
      wireMore(root, id => clientById(id), clientMenu);
    },
  });

  /* ==========================================================================
     /clients/:id: client detail
     ========================================================================== */
  const docTile = (d) => `<div class="p3-tile-wrap"><div class="doc-tile" role="button" tabindex="0" data-doc="${d.id}" aria-label="Preview ${esc(d.name)}">
      <div class="sheet"><span class="ext">${esc(d.ext)}</span><div class="pg">${'<i></i>'.repeat(6)}</div></div>
      <div class="body"><div class="name">${esc(d.name)}</div><div class="mono xs faint ellipsis" style="margin-top:4px">${esc(caseById(d.caseId).no)}</div>
      <div class="row between xs muted" style="margin-top:6px"><span>${esc(d.cat)}</span><span class="mono">v${d.version}</span></div>
      <div class="row between xs faint" style="margin-top:6px"><span>${sizeFmt(d.kb)}, ${fdateShort(d.date)}</span>${d.shared ? chip('Shared', 'ok') : ''}${d.status === 'Archived' ? chip('Archived', '') : ''}</div></div></div>
      <button class="btn ghost sm icon p3-tile-more" data-pop data-more="${d.id}" aria-label="Actions for ${esc(d.name)}">${I('more', 'sm')}</button></div>`;
  const wireTiles = (root) => {
    root.addEventListener('click', e => { if (e.target.closest('[data-more]')) return; const t = e.target.closest('[data-doc]'); if (t) previewDoc(D.documents.find(d => d.id === +t.dataset.doc)); });
    root.addEventListener('keydown', e => { const t = e.target.closest('.doc-tile[data-doc]'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); } });
  };

  page('/clients/:id', {
    title: (p) => (clientById(p.id) || {}).name || 'Client not found', crumbs: [['Clients', '/clients']], skeleton: 'detail', perm: 'CLIENT_VIEW',
    render(p) {
      const c = clientById(p.id);
      if (!c) return emptyState({ icon: 'users', title: 'Client not found', text: 'This client may have been deleted, or the link is wrong.', action: '<a class="btn" href="#/clients">Back to clients</a>' });
      const cs = clientCases(c.id); const ids = cs.map(x => x.id);
      const active = cs.filter(x => x.status !== 'Closed');
      const next = D.events.filter(e => e.type === 'Hearing' && ids.includes(e.caseId) && e.at >= TODAY).sort((a, b) => a.at - b.at)[0];
      const invs = D.invoices.filter(i => i.client === c.id);
      const billed = sum(invs.filter(i => i.status !== 'Draft' && i.status !== 'Canceled'), i => i.total);
      const out = outstanding(c.id);
      const adv = advById(c.advocate);
      return `<div class="panel" style="margin-bottom:var(--s5)"><div class="panel-body" style="padding:var(--s6)"><div class="p3-head-panel">
          ${avatar(c.name, 'lg')}
          <div class="grow" style="min-width:220px">
            <div class="row wrap" style="gap:8px">${chip(c.kind, 'plain')}${c.archived ? chip('Archived', '') : ''}${c.portal ? chip('Portal enabled', 'ok') : ''}<span class="faint small">Client since ${fdate(c.since, { month: 'short', year: 'numeric' })}</span></div>
            <h1 class="serif">${esc(c.name)}</h1>
            <div class="meta-line"><span>${I('phone', 'sm')}${esc(c.phone)}</span><span>${I('mail', 'sm')}${esc(c.email)}</span><span>${I('pin', 'sm')}${esc([c.building, c.street, c.city, c.pin].filter(Boolean).join(', '))}</span>${adv ? `<span>${I('user', 'sm')}${esc(adv.name)}</span>` : ''}${c.gstin ? `<span class="mono">GSTIN ${esc(c.gstin)}</span>` : ''}</div>
          </div>
          <div class="row wrap" style="gap:8px">
            <button class="btn" id="cd-edit">${I('edit', 'sm')}Edit</button>
            <button class="btn" id="cd-portal">${I('globe', 'sm')}Portal access</button>
            <button class="btn" id="cd-inv">${I('receipt', 'sm')}Raise invoice</button>
            <button class="btn primary" id="cd-case">${I('plus', 'sm')}New case</button>
          </div></div></div></div>
        ${figures([
          ['Active matters', active.length, `${cs.length} in total`],
          ['Next hearing', next ? `<span style="font-size:.7em">${rel(next.at)}</span>` : '<span class="faint" style="font-size:.7em">None listed</span>', next ? `<span class="mono">${esc(next.title)}</span>` : ''],
          ['Billed', inrShort(billed), `${invs.length} invoices`],
          ['Outstanding', inrShort(out), out ? 'Unpaid fees on matters' : 'All fees paid', out ? '' : ''],
        ])}
        <div data-tab-scope>
          <div class="tabs" data-tabs aria-label="Client sections">
            <button data-tab="m" aria-selected="true">Matters <span class="faint">${cs.length}</span></button>
            <button data-tab="h">Hearings</button>
            <button data-tab="i">Invoices and payments</button>
            <button data-tab="d">Documents <span class="faint">${D.documents.filter(d => d.client === c.id).length}</span></button>
            <button data-tab="c">Communication</button>
            <button data-tab="n">Notes</button>
          </div>
          <div class="tab-panel" data-panel="m"><div id="cd-m"></div></div>
          <div class="tab-panel" data-panel="h"><div id="cd-h"></div></div>
          <div class="tab-panel" data-panel="i"><h3 style="margin-bottom:10px">Invoices</h3><div id="cd-i"></div><h3 style="margin:24px 0 10px">Payments</h3><div id="cd-p"></div></div>
          <div class="tab-panel" data-panel="d"><div id="cd-d"></div></div>
          <div class="tab-panel" data-panel="c"><div id="cd-c"></div></div>
          <div class="tab-panel" data-panel="n"><div id="cd-n"></div></div>
        </div>`;
    },
    mount(root, p) {
      const c = clientById(p.id); if (!c) return;
      const cs = clientCases(c.id); const ids = cs.map(x => x.id);
      root.querySelector('#cd-edit').onclick = () => FORMS.client(c, redraw);
      root.querySelector('#cd-portal').onclick = () => portalDialog(c, redraw);
      root.querySelector('#cd-inv').onclick = () => FORMS.invoice({ caseId: (cs.find(x => x.status !== 'Closed') || {}).id, onSave: redraw });
      root.querySelector('#cd-case').onclick = () => go('/cases/new');

      DataTable(root.querySelector('#cd-m'), {
        rows: cs, onRow: x => go('/cases/' + x.id),
        columns: [
          { key: 'no', label: 'Case', sort: true, render: x => `<div class="mono small cell-title">${esc(x.no)}</div><div class="cell-sub">${esc(x.title)}</div>` },
          { key: 'courtName', label: 'Court', render: x => `${esc(x.courtName)}<div class="cell-sub">${esc(x.hall || '')}</div>`, hideSm: true },
          { key: 'stage', label: 'Stage', hideSm: true },

        empty: { icon: 'case', title: 'No matters yet', text: 'Open a case for this client to start tracking hearings.' },

      const evs = D.events.filter(e => ids.includes(e.caseId) && e.at >= TODAY).sort((a, b) => a.at - b.at);
      DataTable(root.querySelector('#cd-h'), {
        rows: evs, onRow: e => go('/cases/' + e.caseId),
        columns: [
          { key: 'at', label: 'When', sort: e => +e.at, render: e => `<b>${rel(e.at)}</b><div class="cell-sub">${fdate(e.at)}, ${ftime(e.at)}</div>` },
          { key: 'type', label: 'Type', render: e => chip(e.type, e.type === 'Hearing' ? 'info' : 'plain') },
          { key: 'title', label: 'Matter', render: e => `<span class="${e.type === 'Hearing' ? 'mono small' : ''}">${esc(e.title)}</span>` },
          { key: 'court', label: 'Court', render: e => `${esc(e.court)}<div class="cell-sub">${esc(e.hall || '')}</div>`, hideSm: true },
          { key: 'purpose', label: 'Purpose', hideSm: true },

        empty: { icon: 'calendar', title: 'No upcoming hearings', text: 'Nothing is listed for this client\'s matters.' },
      });

      DataTable(root.querySelector('#cd-i'), {
        rows: D.invoices.filter(i => i.client === c.id), onRow: i => go('/invoices?id=' + i.id),
        columns: [
          { key: 'no', label: 'Invoice no', render: i => `<span class="mono small">${esc(i.no)}</span>` },
          { key: 'case', label: 'Case', render: i => caseCell(caseById(i.caseId)), hideSm: true },
          { key: 'date', label: 'Date', sort: i => +i.date, render: i => fdate(i.date) },
          { key: 'total', label: 'Total', cls: 'amt', render: i => `<span class="mono">${inr(i.total)}</span>` },
          { key: 'status', label: 'Status', render: i => chip(invStatus(i)) },

        empty: { icon: 'receipt', title: 'No invoices yet' },

      DataTable(root.querySelector('#cd-p'), {
        rows: D.payments.filter(x => x.client === c.id), initialSort: { key: 'date', dir: 'desc' },
        columns: [
          { key: 'date', label: 'Date', sort: x => +x.date, render: x => fdate(x.date) },
          { key: 'case', label: 'Case', render: x => caseCell(caseById(x.caseId)), hideSm: true },
          { key: 'mode', label: 'Mode', render: x => chip(x.mode, 'plain') },

          { key: 'amount', label: 'Amount', cls: 'amt', render: x => `<span class="mono">${inr(x.amount)}</span>` },

      const log = D.deliveryLog.filter(x => x.name === c.name).map(x => ({ at: x.at, ch: x.channel, subject: x.subject, status: x.status }));
      const portal = c.id === 1 ? D.messages.map(m => ({ at: m.at, ch: 'Portal message', subject: m.subject, status: 'Sent', body: m.body })) : [];

        : emptyState({ icon: 'send', title: 'No messages sent', text: 'Hearing reminders, receipts and portal messages to this client appear here.' });

      const nbox = root.querySelector('#cd-n');
      nbox.innerHTML = `<div class="panel"><div class="panel-body stack" style="gap:12px">
        ${c.note ? `<p style="white-space:pre-line">${esc(c.note)}</p>` : '<p class="faint">No notes yet.</p>'}
        <div class="field"><label for="cd-note">Add a note</label><textarea id="cd-note" class="input" rows="3" placeholder="Referral, preferences, matter background"></textarea></div>

    },
  });

  /* ==========================================================================
     /documents
     ========================================================================== */
  const docState = { view: 'grid', q: '', cat: '', type: '', status: 'Active', shared: false };
  const TYPE_EXT = { PDF: ['pdf'], Word: ['doc', 'docx'], Image: ['jpg', 'jpeg', 'png'], ZIP: ['zip'] };
  function docMenu(d, after) {

              { key: 'date', label: 'Uploaded', sort: d => +d.date, render: d => `${fdate(d.date)}<div class="cell-sub">${esc(d.by)}</div>`, hideSm: true },

  /* ==========================================================================
     /reports

     changes numbers plausibly. Deterministic, so the demo is repeatable.
     ========================================================================== */
  const RANGES = { month: ['This month', 1, 6, 12.4], last: ['Last month', 0.92, 6, -4.1], quarter: ['This quarter', 2.85, 9, 8.7], year: ['This year', 10.6, 12, 21.3], custom: ['Custom', 1, 6, 3.2] };
  let rptRange = 'month'; let rptFrom = day(-45).toISOString().slice(0, 10); let rptTo = TODAY.toISOString().slice(0, 10);
  const MONTHS = (n) => Array.from({ length: n }, (_, i) => { const d = new Date(TODAY); d.setDate(1); d.setMonth(d.getMonth() - (n - 1 - i)); return d.toLocaleDateString('en-IN', { month: 'short' }); });
  const delta = (pct, goodUp = true) => { const up = pct >= 0; const good = up === goodUp; return `<span class="${good ? 'up' : 'down'}">${up ? '+' : '−'}${Math.abs(pct).toFixed(1)}%</span> vs previous period`; };

    const monthRev = sum(D.payments, p => p.amount) / 4; const monthExp = sum(D.expenses, x => x.amount) / 6;
    const rev = Math.round(monthRev * f); const exp = Math.round(monthExp * f);
    const outAmt = sum(D.invoices.filter(i => ['Unpaid', 'Overdue'].includes(invStatus(i))), i => i.total);
    const labels = MONTHS(months);
    const inc = labels.map((_, i) => Math.round(monthRev * (0.72 + 0.28 * Math.sin(i * 1.3 + 1) + i * 0.02)));
    const out = labels.map((_, i) => Math.round(monthExp * (0.8 + 0.35 * Math.cos(i * 1.7))));
    const st = ['Active', 'Pending', 'Closed'].map(s => ({ label: s, value: D.cases.filter(c => c.status === s).length }));
    st[0].color = 'var(--ink)'; st[1].color = 'var(--warn)'; st[2].color = 'var(--mute)';
    const levels = ['Supreme Court', 'High Court', 'District'];
    const types = Object.entries(D.cases.reduce((m, c) => { m[c.type] = (m[c.type] || 0) + 1; return m; }, {})).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const newCl = MONTHS(6).map((_, i) => D.clients.filter(c => { const k = Math.floor(-daysFrom(c.since) / 30); return k === 5 - i; }).length + (i % 2));
    const topCl = Object.entries(D.invoices.reduce((m, i) => { if (i.status !== 'Canceled') m[i.client] = (m[i.client] || 0) + i.total; return m; }, {})).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const hearToday = D.events.filter(e => e.type === 'Hearing' && daysFrom(e.at) === 0).length;
    const hear30 = D.events.filter(e => e.type === 'Hearing' && daysFrom(e.at) > 0 && daysFrom(e.at) <= 30).length;
    const courts = Object.entries(D.events.filter(e => e.type === 'Hearing').reduce((m, e) => { m[e.court] = (m[e.court] || 0) + 1; return m; }, {})).sort((a, b) => b[1] - a[1]);
    const csv = (s) => `<button class="btn ghost sm" data-csv="${s}">${I('download', 'sm')}Download CSV</button>`;
    return `<div class="section-title"><h2>Financial</h2>${csv('financial')}</div>
      ${figures([
        ['Revenue', inrShort(rev), delta(chg)], ['Expenses', inrShort(exp), delta(chg * 0.4 - 2, false)],
        ['Net income', inrShort(rev - exp), delta(chg * 1.1)], ['Outstanding', inrShort(outAmt), delta(-chg * 0.6, false)],
      ])}
      <div class="panel"><div class="panel-head"><h3>Cash flow</h3>${legend([{ label: 'Income', color: 'var(--ink)' }, { label: 'Expenses', color: 'var(--tape)' }])}</div><div class="panel-body">${lineChart({ labels, series: [{ name: 'Income', data: inc, color: 'var(--ink)' }, { name: 'Expenses', data: out, color: 'var(--tape)', dash: true }], money: true })}</div></div>
      <div class="section-title"><h2>Cases</h2>${csv('cases')}</div>
      <div class="grid g-3">
        <div class="panel"><div class="panel-head"><h3>By status</h3></div><div class="panel-body stack" style="align-items:center;gap:12px">${donut({ parts: st, label: String(D.cases.length), sub: 'cases' })}${legend(st)}</div></div>
        <div class="panel"><div class="panel-head"><h3>By court level</h3></div><div class="panel-body">${barChart({ labels: levels, series: [{ name: 'Cases', data: levels.map(l => D.cases.filter(c => c.level === l).length) }], height: 200 })}</div></div>
        <div class="panel"><div class="panel-head"><h3>By case type</h3><span class="sub">Top 6</span></div><div class="panel-body">${barRows(types)}</div></div>
      </div>
      <div class="section-title"><h2>Clients</h2>${csv('clients')}</div>
      <div class="grid g-2">
        <div class="panel"><div class="panel-head"><h3>New clients per month</h3></div><div class="panel-body">${barChart({ labels: MONTHS(6), series: [{ name: 'New clients', data: newCl }], height: 200 })}</div></div>
        <div class="panel"><div class="panel-head"><h3>Top clients by billing</h3></div><div class="table-wrap" style="border:0"><table class="t"><thead><tr><th scope="col">Client</th><th scope="col" class="amt">Billed</th><th scope="col" class="amt">Outstanding</th></tr></thead><tbody>
          ${topCl.map(([id, v]) => `<tr><td><a class="link" href="#/clients/${id}">${esc(clientById(id).name)}</a></td><td class="amt mono">${inr(Math.round(v * Math.min(f, 1.4)))}</td><td class="amt mono">${inr(outstanding(id))}</td></tr>`).join('')}</tbody></table></div></div>
      </div>
      <div class="section-title"><h2>Hearings</h2>${csv('hearings')}</div>
      ${figures([['Today', hearToday, 'Listed across all courts'], ['Upcoming 30 days', hear30, 'Scheduled hearings'], ['Adjourned rate', (34 + chg / 4).toFixed(0) + '%', delta(-chg / 3, false)]])}
      <div class="panel"><div class="panel-head"><h3>Hearings by court</h3></div><div class="panel-body">${barRows(courts)}</div></div>`;
  }
  page('/reports', {
    title: 'Reports', perm: 'REPORT_VIEW', skeleton: 'dashboard',
    render() {
      return `${pageHead('Reports', 'Practice performance across billing, cases, clients and hearings.', `<button class="btn primary" id="rp-pdf">${I('download', 'sm')}Export PDF</button>`)}
        <div class="row wrap" style="gap:12px">${seg('rng', Object.entries(RANGES).map(([k, v]) => [k, v[0]]), rptRange, 'Date range')}
          <div class="row" id="rp-custom" ${rptRange === 'custom' ? '' : 'hidden'} style="gap:8px"><label class="sr-only" for="rp-from">From</label><input type="date" class="input" id="rp-from" value="${rptFrom}"><span class="faint">to</span><label class="sr-only" for="rp-to">To</label><input type="date" class="input" id="rp-to" value="${rptTo}"></div></div>
        <div id="rp-body">${reportBody()}</div>`;

    mount(root) {
      const body = root.querySelector('#rp-body'); const cust = root.querySelector('#rp-custom');
      const draw = () => { body.innerHTML = reportBody(); };
      root.querySelector('#rp-pdf').onclick = (e) => busy(e.currentTarget, () => toast(`Report for ${esc(RANGES[rptRange][0].toLowerCase())} exported as PDF`, 'ok'));
      root.addEventListener('segchange', e => { if (e.target.dataset.seg !== 'rng') return; rptRange = e.detail; cust.hidden = rptRange !== 'custom'; draw(); });
      root.querySelector('#rp-from').onchange = e => { rptFrom = e.target.value; draw(); };

    },
  });
})();

  115: 'The High Court may call for the record of any case decided by any Court subordinate to it in which no appeal lies, if such subordinate Court appears to have exercised a jurisdiction not vested in it by law, or failed to exercise a jurisdiction so vested, or acted illegally or with material irregularity.',
};
const sectionText = (a, no, title) => CPC_TEXT[no] && a.id === 1 ? CPC_TEXT[no]
  : `${title}. This section of ${a.title.replace(/^The /, 'the ')} sets out the rule on ${title.toLowerCase()}, subject to the other provisions of this Act and any rules made under it.`;

const ENACTED = { 1: '1908-03-21', 2: '2023-12-25', 3: '2023-12-25', 4: '1996-08-16', 5: '1881-12-09', 6: '2017-11-22', 7: '2019-08-09', 8: '1955-12-31', 9: '2023-12-25', 10: '1955-05-18' };
const LINKED = { 1: [2, 16, 19, 25], 2: [23], 3: [9, 14], 4: [5, 21], 5: [10], 6: [22, 1], 7: [13], 8: [1], 9: [], 10: [18] };

function actMatches(a, f, q) {
  if (!q) return true;
  const s = q.toLowerCase();
  if (f === 'Short title') return a.title.toLowerCase().includes(s);
  if (f === 'Long title') return a.desc.toLowerCase().includes(s);
  if (f === 'Department') return (a.ministry + ' ' + a.dept).toLowerCase().includes(s);
  if (f === 'Section title') return chaptersFor(a).some(c => c.items.some(([, t]) => t.toLowerCase().includes(s)));
  if (f === 'Act number') return String(a.no) === q.trim();
  if (f === 'Act year') { const [x, y] = q.split('-').map(Number); return a.year >= x && a.year <= (y || x); }
  return true;
}

page('/acts', {

  mount(root) {

      const list = root.querySelector('#act-list');

      const rows = D.acts.filter(a => (st.j === 'All' || a.juris === st.j) && actMatches(a, st.f, st.q.trim()));
      root.querySelector('#act-count').textContent = `${rows.length} ${rows.length === 1 ? 'act' : 'acts'}`;
      list.innerHTML = rows.length ? rows.map(a => `<a class="panel pp-card" href="#/acts/${a.id}"><div class="panel-body" style="padding:16px 20px">
          <div class="row wrap" style="gap:10px;margin-bottom:6px">${jurChip(a)}<span class="mono faint small">Act ${a.no} of ${a.year}</span></div>
          <h3>${esc(a.title)}</h3>
          <p class="muted small" style="margin-top:4px">${esc(a.desc)}</p>
          <div class="faint xs" style="margin-top:8px">${esc(a.ministry)}${a.dept !== a.ministry ? ', ' + esc(a.dept) : ''}</div></div></a>`).join('')
        : `<div class="panel">${emptyState({ icon: 'book', title: 'No acts match', text: 'Try a shorter word such as "arbitration" or "tenants". To search by year, choose Act year and enter 2023 or 2010-2020.', action: '<button class="btn sm" id="act-reset">Clear search</button>' })}</div>`;
      const r = root.querySelector('#act-reset'); if (r) r.onclick = () => { inp.value = ''; st.q = ''; draw(); inp.focus(); };
    };
    inp.addEventListener('input', debounce(() => { st.q = inp.value; draw(); }, 250));
    root.querySelector('#act-j').addEventListener('segchange', e => { st.j = e.detail; draw(); });
    root.querySelector('#act-f').addEventListener('click', e => {
      const b = e.target.closest('[data-f]'); if (!b) return;
      root.querySelectorAll('#act-f [data-f]').forEach(x => x.setAttribute('aria-pressed', x === b));
      st.f = b.dataset.f; inp.placeholder = ACT_FIELDS[st.f]; inp.setAttribute('aria-label', 'Search acts by ' + st.f.toLowerCase());

  },
});

const CODE_TABS = [['IPC', 'BNS', 'Indian Penal Code', 'Bharatiya Nyaya Sanhita'], ['CrPC', 'BNSS', 'Code of Criminal Procedure', 'Bharatiya Nagarik Suraksha Sanhita'], ['IEA', 'BSA', 'Indian Evidence Act', 'Bharatiya Sakshya Adhiniyam']];
page('/law-codes', {

    <div class="tabs" role="tablist" id="lc-tabs">${CODE_TABS.map(([f, t], i) => `<button role="tab" data-code="${f}" aria-selected="${i === 0}">${f} to ${t}</button>`).join('')}</div>

      const all = D.lawCodes.filter(x => x.from === st.code);

      const rows = all.filter(x => !s || (st.dir === 'old' ? x.old : x.nw).toLowerCase().includes(s) || x.desc.toLowerCase().includes(s));
      if (!rows.find(x => x.id === st.sel)) st.sel = rows[0] ? rows[0].id : null;
      root.querySelector('#lc-count').textContent = `${rows.length} of ${all.length} sections in ${tab[0]} to ${tab[1]}`;
      const sel = rows.find(x => x.id === st.sel);

      <div class="actions"><a class="btn" href="#/drafting/templates">${I('template', 'sm')}Templates</a><a class="btn primary" href="#/drafting/new">${I('plus', 'sm')}New draft</a></div></div>
    <div id="dr-t"></div>`,
  mount(root) {
    let tbl;
    const cols = [
      { key: 'id', label: 'Draft #', sort: true, render: d => `<span class="mono">#${d.id}</span>` },
      { key: 'template', label: 'Template', sort: true, render: d => esc(d.template === '—' ? 'No template' : d.template) },
      { key: 'caseId', label: 'Case', render: d => { const c = caseById(d.caseId); return `<a class="link mono" href="#/cases/${c.id}">${esc(c.no)}</a>`; } },
      { key: 'docs', label: 'Reference docs', cls: 'num', hideSm: true },
      { key: 'created', label: 'Created', sort: true, hideSm: true, render: d => fdt(d.created) },
      { key: 'cited', label: 'Citations', hideSm: true, render: d => d.status !== 'Ready' || !d.cited[1] ? '<span class="faint">—</span>' : `<div class="row"><span class="small">${d.cited[0]} of ${d.cited[1]} verified</span><span class="bar-track cite-bar" aria-hidden="true"><i style="width:${d.cited[0] / d.cited[1] * 100}%;background:var(${d.cited[0] === d.cited[1] ? '--ok' : '--warn'})"></i></span></div>` },
      { key: 'status', label: 'Status', sort: true, render: d => d.status === 'Generating' ? `<span class="chip warn plain"><span class="pp-spin" aria-hidden="true"></span>Generating</span>` : chip(d.status) },
      { key: 'act', label: '<span class="sr-only">Actions</span>', cls: 'right', render: d => `<div class="row" style="justify-content:flex-end">${d.status === 'Ready' ? `<a class="btn sm" href="#/drafting/${d.id}">Open</a>` : ''}${d.status === 'Failed' ? `<button class="btn sm" data-redraft="${d.id}">${I('refresh', 'sm')}Re-draft</button>` : ''}<button class="btn ghost sm icon" data-del="${d.id}" aria-label="Delete draft ${d.id}">${I('trash', 'sm')}</button></div>` },
    ];
    tbl = DataTable(root.querySelector('#dr-t'), {
      columns: cols, rowsFn: () => D.drafts, initialSort: { key: 'id', dir: 'desc' },
      search: { placeholder: 'Search drafts by template or case', keys: ['template', d => caseById(d.caseId).no, d => '#' + d.id] },
      filters: [{ key: 'status', label: 'Status', options: ['Ready', 'Generating', 'Failed'] }],
      onRow: d => d.status === 'Ready' ? go('/drafting/' + d.id) : toast(d.status === 'Failed' ? `Draft #${d.id} failed. Use Re-draft to try again.` : `Draft #${d.id} is still generating`, 'info'),
      empty: { icon: 'pen', title: 'No drafts yet', text: 'Start from a case\'s documents or type the facts directly.', action: '<a class="btn primary sm" href="#/drafting/new">New draft</a>' },
    });
    const finish = (d, ms) => setTimeout(() => {
      d.status = 'Ready'; d.cited = [7, 8]; tbl.refresh();
      toast(`Draft #${d.id} is ready`, 'ok', { action: { label: 'Open', href: '#/drafting/' + d.id } });
    }, ms);
    D.drafts.filter(d => d.status === 'Generating').forEach(d => finish(d, 4000));
    root.querySelector('#dr-t').addEventListener('click', e => {
      const r = e.target.closest('[data-redraft]'); const x = e.target.closest('[data-del]');
      if (r) { const d = D.drafts.find(y => y.id === +r.dataset.redraft); d.status = 'Generating'; tbl.refresh(); toast(`Re-drafting #${d.id}`, 'info'); finish(d, 4000); }
      if (x) {
        const d = D.drafts.find(y => y.id === +x.dataset.del);
        confirmDialog({ title: `Delete draft #${d.id}?`, text: `${esc(draftTitle(d))} for ${esc(caseById(d.caseId).no)} will be deleted. Documents saved to the case are kept.`, confirm: 'Delete draft', danger: true, onConfirm() { D.drafts.splice(D.drafts.indexOf(d), 1); tbl.refresh(); toast(`Draft #${d.id} deleted`); } });
      }
    });
  },
});

/* ==========================================================================

const TPL_FIELDS = {
  Plaint: [['Plaintiff', 0], ['Defendant', 1], ['Property address'], ['Monthly rent (₹)'], ['Arrears (₹)']],
  'Appeal memorandum': [['Appellant', 0], ['Respondent', 1], ['Lower court decree'], ['Date of decree']],
  Notice: [['Drawer of cheque', 1], ['Payee', 0], ['Cheque number'], ['Cheque amount (₹)']],
  Vakalatnama: [['Client', 0], ['Court'], ['Case number']],
  none: [['Party 1', 0], ['Party 2', 1], ['Subject matter']],
};
page('/drafting/new', {
  title: 'New draft', crumbs: [['Drafts', '/drafting']], perm: 'DRAFT_VIEW',
  render: () => `<div class="page-head"><div><h1>New draft</h1><p>PactPro drafts from your documents and cites the source for every fact it uses.</p></div></div><div id="wz"></div>`,
  mount(root) {
    const qs = query();
    const tplPre = D.templates.find(t => t.id === +qs.get('template') && t.status === 'Ready');
    const st = { mode: null, step: 0, caseId: +qs.get('caseId') || '', docs: new Set(), tpl: tplPre ? tplPre.id : '', facts: {}, prompt: '', bns: true, agreement: 'Lease deed', parties: [{ name: '', role: 'Lessor', address: '' }, { name: '', role: 'Lessee', address: '' }] };
    if (tplPre) st.mode = 'ref';
    const box = root.querySelector('#wz');
    const STEPS = { ref: ['Documents', 'Template', 'Facts and instructions', 'Review'], scratch: ['Setup', 'Key terms', 'Review'] };
    const tplObj = () => D.templates.find(t => t.id === +st.tpl);
    const fieldsFor = () => TPL_FIELDS[tplObj() ? tplObj().type : 'none'] || TPL_FIELDS.none;
    const caseSel = () => field({ id: 'w-case', label: 'Case', options: D.cases.map(c => [c.id, `${c.no}, ${c.title}`]), value: st.caseId, placeholder: 'Select a case', required: true, err: 'Choose the case this draft is for.' });

    const draw = () => {
      if (!st.mode) {
        box.innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:860px">
          <button class="pp-opt" data-mode="ref">${I('folder', 'lg')}<h3>Start from reference documents</h3><span class="muted small">Pick the plaint, agreement or orders already in the case file. Facts are pulled from them and cited.</span></button>
          <button class="pp-opt" data-mode="scratch">${I('pen', 'lg')}<h3>Type the facts directly</h3><span class="muted small">Set up the parties and key terms yourself. Good for agreements and fresh matters with no papers yet.</span></button></div>`;
        return;
      }
      const steps = STEPS[st.mode]; const name = steps[st.step];
      let body = '';
      if (name === 'Documents') {
        const docs = st.caseId ? D.documents.filter(d => d.caseId === +st.caseId) : [];
        body = `<div class="form-grid">${caseSel()}</div>
          <div style="margin-top:18px"><div class="label" style="margin-bottom:8px">Reference documents</div>
          ${!st.caseId ? '<p class="faint small">Choose a case to see its documents.</p>' : docs.length ? `<div class="panel" style="padding:4px 0">${docs.map(d => `<label class="list-item check" style="cursor:pointer"><input type="checkbox" data-doc="${d.id}" ${st.docs.has(d.id) ? 'checked' : ''}>${I(docIcon(d.ext), 'sm')}<span class="grow">${esc(d.name)}</span><span class="faint xs hide-sm">${esc(d.cat)}, ${sizeFmt(d.kb)}</span></label>`).join('')}</div>` : emptyState({ icon: 'folder', title: 'This case has no documents', text: 'Upload documents to the case, or go back and type the facts directly.' })}
          <div class="callout bad" id="w-docerr" hidden style="margin-top:10px">${I('warn', 'sm')}<div>Pick at least one document to draft from.</div></div></div>`;
      } else if (name === 'Template') {
        body = `<div class="stack" role="radiogroup" aria-label="Template" style="gap:8px;max-width:720px">
          ${[{ id: '', name: 'No template', type: 'PactPro picks a structure from the documents', fields: '' }, ...D.templates.filter(t => t.status === 'Ready')].map(t => `<label class="panel row" style="padding:14px 16px;cursor:pointer;gap:12px"><input type="radio" name="w-tpl" value="${t.id}" ${String(st.tpl) === String(t.id) ? 'checked' : ''} style="accent-color:var(--ink)"><span class="grow"><b class="small">${esc(t.name)}</b><span class="faint xs" style="display:block">${esc(t.type)}${t.lang ? ', ' + esc(t.lang) : ''}</span></span>${t.fields ? `<span class="faint xs">${t.fields} fields</span>` : ''}</label>`).join('')}</div>`;
      } else if (name === 'Facts and instructions') {
        const c = caseById(st.caseId);
        body = `<form class="form-grid" novalidate id="w-form">
          ${fieldsFor().map(([l, pi], i) => field({ id: 'w-f' + i, label: l, value: st.facts[l] ?? (pi != null && c ? c.party[pi] : ''), required: i < 2, err: `Enter the ${l.toLowerCase()}.`, type: /₹/.test(l) ? 'number' : 'text' })).join('')}
          ${field({ id: 'w-prompt', label: 'Instructions for the draft', type: 'textarea', rows: 4, full: true, value: st.prompt, placeholder: 'For example: claim mesne profits from the date of the quit notice; keep the prayer short.' })}
          <label class="check full"><input type="checkbox" id="w-bns" ${st.bns ? 'checked' : ''}> Use BNS/BNSS section numbers</label></form>`;
      } else if (name === 'Setup') {
        body = `<form class="form-grid" novalidate id="w-form">${caseSel()}
          ${field({ id: 'w-agr', label: 'Agreement type', options: ['Lease deed', 'Sale agreement', 'Joint development agreement', 'Settlement deed', 'Power of attorney', 'Employment agreement'], value: st.agreement, required: true })}
          ${field({ id: 'w-tpl2', label: 'Template', options: D.templates.filter(t => t.status === 'Ready').map(t => [t.id, t.name]), value: st.tpl, placeholder: 'No template', full: true })}</form>`;
      } else if (name === 'Key terms') {
        body = `<form novalidate id="w-form"><div class="stack" id="w-parties">${st.parties.map((p, i) => `<div class="panel"><div class="panel-body" style="padding:14px 16px">
            <div class="row between" style="margin-bottom:10px"><b class="small">Party ${i + 1}</b><button type="button" class="btn ghost sm" data-rmp="${i}" ${st.parties.length <= 2 ? 'disabled' : ''} aria-label="Remove party ${i + 1}">${I('trash', 'sm')}Remove</button></div>
            <div class="form-grid">${field({ id: 'w-pn' + i, label: 'Name', value: p.name, required: true, err: 'Enter the party\'s name.' })}${field({ id: 'w-pr' + i, label: 'Role', options: ['Lessor', 'Lessee', 'Vendor', 'Purchaser', 'Developer', 'Land owner', 'Witness'], value: p.role })}${field({ id: 'w-pa' + i, label: 'Address', value: p.address, full: true })}</div></div></div>`).join('')}</div>
          <button type="button" class="btn ghost sm" id="w-addp" style="margin-top:10px">${I('plus', 'sm')}Add party</button></form>`;
      } else if (name === 'Review') {
        const c = caseById(st.caseId);
        const kv = st.mode === 'ref'
          ? [['Case', c ? `<span class="mono">${esc(c.no)}</span>` : '—'], ['Reference documents', [...st.docs].map(id => esc(D.documents.find(d => d.id === id).name)).join('<br>')], ['Template', esc(tplObj() ? tplObj().name : 'No template')], ...Object.entries(st.facts).filter(([, v]) => v).map(([k, v]) => [esc(k), esc(v)]), ['Instructions', esc(st.prompt || 'None')], ['Section numbers', st.bns ? 'BNS/BNSS' : 'IPC/CrPC']]
          : [['Case', c ? `<span class="mono">${esc(c.no)}</span>` : '—'], ['Agreement type', esc(st.agreement)], ['Template', esc(tplObj() ? tplObj().name : 'No template')], ...st.parties.map((p, i) => [`Party ${i + 1}`, `${esc(p.name)}, ${esc(p.role)}${p.address ? '<br><span class="faint xs">' + esc(p.address) + '</span>' : ''}`])];
        body = `<div class="panel tinted" style="max-width:720px"><div class="panel-body"><dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></div>
          <p class="faint small" style="margin-top:12px">Drafting takes about a minute for a plaint. You can leave this page; we will notify you.</p>`;
      }
      box.innerHTML = `<ol class="wz-steps">${steps.map((s, i) => `<li class="${i < st.step ? 'done' : ''}" ${i === st.step ? 'aria-current="step"' : ''}><span class="n">${i < st.step ? I('check', 'sm') : i + 1}</span>${s}</li>`).join('')}</ol>
        <div class="panel"><div class="panel-body" style="padding:24px"><h2 style="font-size:var(--t-xl);margin-bottom:16px">${name}</h2>${body}</div>
        <div class="row between" style="padding:14px 24px;border-top:1px solid var(--line)"><button class="btn ghost" id="w-back">${st.step === 0 ? 'Change starting point' : 'Back'}</button>
          <button class="btn primary" id="w-next">${name === 'Review' ? I('sparkle', 'sm') + 'Generate draft' : 'Continue'}</button></div></div>`;
      wireBody();
    };
    const collect = () => {
      const v = (id) => { const e = box.querySelector('#' + id); return e ? e.value.trim() : undefined; };
      if (box.querySelector('#w-case')) st.caseId = v('w-case');
      const r = box.querySelector('input[name="w-tpl"]:checked'); if (r) st.tpl = r.value;
      if (box.querySelector('#w-f0')) { fieldsFor().forEach(([l], i) => st.facts[l] = v('w-f' + i)); st.prompt = v('w-prompt'); st.bns = box.querySelector('#w-bns').checked; }
      if (box.querySelector('#w-agr')) { st.agreement = v('w-agr'); st.tpl = v('w-tpl2'); }
      st.parties.forEach((p, i) => { if (box.querySelector('#w-pn' + i)) { p.name = v('w-pn' + i); p.role = v('w-pr' + i); p.address = v('w-pa' + i); } });
    };
    const wireBody = () => {
      const cs = box.querySelector('#w-case');
      if (cs && STEPS[st.mode][st.step] === 'Documents') cs.onchange = () => { collect(); st.docs.clear(); st.facts = {}; draw(); };
      box.querySelectorAll('[data-doc]').forEach(c => c.onchange = () => { c.checked ? st.docs.add(+c.dataset.doc) : st.docs.delete(+c.dataset.doc); box.querySelector('#w-docerr').hidden = true; });
      box.querySelectorAll('input[name="w-tpl"]').forEach(r => r.onchange = () => { st.tpl = r.value; st.facts = {}; });
      const add = box.querySelector('#w-addp'); if (add) add.onclick = () => { collect(); st.parties.push({ name: '', role: 'Witness', address: '' }); draw(); box.querySelector('#w-pn' + (st.parties.length - 1)).focus(); };
      box.querySelectorAll('[data-rmp]').forEach(b => b.onclick = () => { collect(); st.parties.splice(+b.dataset.rmp, 1); draw(); });
      box.querySelector('#w-back').onclick = () => { collect(); if (st.step === 0) { st.mode = null; } else st.step--; draw(); };
      box.querySelector('#w-next').onclick = (e) => {
        const name = STEPS[st.mode][st.step];
        const form = box.querySelector('#w-form') || box.querySelector('.panel-body');
        if (!validateForm(form)) return;
        collect();
        if (name === 'Documents' && !st.docs.size) { box.querySelector('#w-docerr').hidden = false; return; }
        if (name !== 'Review') { st.step++; draw(); window.scrollTo(0, 0); return; }
        busy(e.currentTarget, () => {
          const t = tplObj(); const id = nextId(D.drafts);
          D.drafts.unshift({ id, template: t ? t.name : (st.mode === 'scratch' ? st.agreement : '—'), caseId: +st.caseId, docs: st.docs.size, created: new Date(), cited: st.mode === 'ref' ? [9, 10] : [0, 0], status: 'Ready' });
          go('/drafting/' + id); toast(`Draft #${id} generated. Fill the highlighted fields, then save it to the case.`, 'ok');
        }, 1200);
      };
    };
    box.addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) { st.mode = b.dataset.mode; st.step = 0; draw(); } });
    draw();
  },
});

          <span class="sep"></span><button class="btn ghost sm icon" data-cmd="undo" aria-label="Undo">${I('restore', 'sm')}</button><button class="btn ghost sm icon" data-cmd="redo" aria-label="Redo">${I('refresh', 'sm')}</button>
          <span class="sep"></span><div class="input-icon" style="width:180px">${I('search', 'sm')}<input class="input" id="ed-find" type="search" placeholder="Find" aria-label="Find in document" style="height:28px"></div><span class="faint xs" id="ed-findn" aria-live="polite"></span>
        </div>
        <article class="paper-sheet" id="sheet" contenteditable="true" spellcheck="true" aria-label="Draft document">${plaintHtml(c)}</article>
      </div>
      <aside class="ed-pane ed-side" data-tab-scope aria-label="Assistant">

        <div class="tab-panel ed-sec" data-panel="lisa">
          <div class="pp-chat" id="chat" aria-live="polite"><div class="pp-msg ai">I drafted this plaint from ${refs.length} documents in ${esc(c.no)}. Ask me to change tone, tighten a paragraph or check a fact.</div></div>
          <div class="row wrap" style="margin:14px 0 10px;gap:6px">${['More formal', 'More concise', 'Fix grammar'].map(x => `<button class="pp-pill" data-preset="${x}">${x}</button>`).join('')}</div>
          <form id="chat-f" class="row" style="gap:6px"><label class="sr-only" for="chat-in">Message Lisa</label><input class="input grow" id="chat-in" placeholder="Ask Lisa to change the draft" autocomplete="off"><button class="btn primary icon" aria-label="Send">${I('send', 'sm')}</button></form>
        </div>
        <div class="tab-panel" data-panel="review" hidden>
          <div class="ed-sec"><h3>Consistency</h3><div class="stack" style="gap:10px">${FINDINGS.map(([s, t, txt, pid]) => `<div class="panel tinted"><div class="panel-body" style="padding:10px 12px">${chip(s, t)}<p class="small" style="margin:6px 0">${esc(txt)}</p><button class="link xs" style="background:none;border:0;padding:0" data-goto="${pid}">Go to clause</button></div></div>`).join('')}</div></div>
          <div class="ed-sec"><h3>Playbook risk</h3><div class="row" style="gap:6px"><label class="sr-only" for="pb-sel">Playbook</label><select class="input grow" id="pb-sel">${D.playbooks.filter(p => p.status === 'Ready').map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn sm" id="pb-run">Run</button></div><div id="pb-out" style="margin-top:12px"></div></div>
        </div>
      </aside>
    </div>`;
  },
  mount(root, p) {
    const d = D.drafts.find(x => x.id === +p.id); if (!d || d.status !== 'Ready') return;
    const c = caseById(d.caseId);
    const sheet = root.querySelector('#sheet');
    const refs = D.documents.filter(x => x.caseId === c.id).slice(0, 4);
    const para = (n) => sheet.querySelector(`[data-para="${n}"]`);
    const flash = (el) => { if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400); };

    /* placeholders: inputs drive every matching span live */
    const updFill = () => {
      const left = PH.filter(([k]) => !root.querySelector('#ph-' + k).value.trim()).length;
      root.querySelector('#ed-fill').innerHTML = left ? chip(`${left} to fill`, 'warn') : chip('All filled', 'ok');
    };
    root.querySelectorAll('[data-ph]').forEach(inp => inp.addEventListener('input', () => {
      const k = inp.dataset.ph; const v = inp.value.trim();
      sheet.querySelectorAll(`.ph[data-k="${k}"]`).forEach(s => { s.textContent = v || PH.find(x => x[0] === k)[1]; s.classList.toggle('filled', !!v); });
      root.querySelector(`[data-okk="${k}"]`).hidden = !v; updFill();
    }));
    updFill();

    /* references */
    root.querySelectorAll('[data-ref]').forEach(b => b.onclick = () => previewDoc(D.documents.find(x => x.id === +b.dataset.ref)));
    root.querySelectorAll('[data-refmenu]').forEach(b => b.onclick = () => { const doc = D.documents.find(x => x.id === +b.dataset.refmenu); popMenu(b, [{ label: 'Preview', icon: 'eye', onClick: () => previewDoc(doc) }, { label: 'Translate', icon: 'translate', onClick: () => go('/drafting/translate/' + doc.id) }]); });
    const openCite = (n) => { const doc = refs[n - 1]; if (doc) { toast(`Source [${n}]: ${esc(doc.name)}`, 'info'); previewDoc(doc); } else toast(`Source [${n}]: Sec. 20, Code of Civil Procedure, 1908`, 'info', { action: { label: 'Open act', href: '#/acts/1' } }); };
    sheet.addEventListener('click', e => { const s = e.target.closest('.cite'); if (s) openCite(+s.dataset.cite); });
    sheet.addEventListener('keydown', e => { const s = e.target.closest && e.target.closest('.cite'); if (s && e.key === 'Enter') { e.preventDefault(); openCite(+s.dataset.cite); } });

    /* toolbar: execCommand is deprecated but still the simplest way to drive a contenteditable demo */
    root.querySelectorAll('[data-cmd]').forEach(b => { b.addEventListener('mousedown', e => e.preventDefault()); b.onclick = () => { sheet.focus(); document.execCommand(b.dataset.cmd); }; });
    const clearMarks = () => { sheet.querySelectorAll('mark.find-hit').forEach(m => m.replaceWith(document.createTextNode(m.textContent))); sheet.normalize(); };
    const find = debounce(() => {
      clearMarks();
      const s = root.querySelector('#ed-find').value.trim(); const out = root.querySelector('#ed-findn');
      if (s.length < 2) { out.textContent = ''; return; }
      const re = new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      const w = document.createTreeWalker(sheet, NodeFilter.SHOW_TEXT); const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
      let n = 0;
      nodes.forEach(t => {
        if (!re.test(t.data)) return; re.lastIndex = 0;
        const frag = document.createDocumentFragment(); let last = 0;
        t.data.replace(re, (m, i) => { frag.append(t.data.slice(last, i)); const mk = document.createElement('mark'); mk.className = 'find-hit'; mk.textContent = m; frag.append(mk); last = i + m.length; n++; return m; });
        frag.append(t.data.slice(last)); t.replaceWith(frag);
      });
      out.textContent = n ? `${n} found` : 'No matches';
      const first = sheet.querySelector('mark.find-hit'); first && first.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 200);
    root.querySelector('#ed-find').addEventListener('input', find);

    /* top bar */
    root.querySelector('#ed-mode').addEventListener('segchange', e => {
      const prev = e.detail === 'preview';
      sheet.setAttribute('contenteditable', !prev); sheet.classList.toggle('preview', prev);
      root.querySelectorAll('[data-cmd]').forEach(b => b.disabled = prev);
    });
    root.querySelector('#ed-dl').onclick = (e) => popMenu(e.currentTarget, ['PDF', 'Word', 'Word on letterhead'].map(f => ({ label: f, icon: 'file', onClick: () => toast(`Downloading draft #${d.id} as ${f}`) })), { width: 210 });
    root.querySelector('#ed-redraft').onclick = () => confirmDialog({ title: 'Re-draft from the documents?', text: 'PactPro will write a fresh draft. Your edits stay in version 2 and you can go back to it.', confirm: 'Re-draft', onConfirm() { d.status = 'Generating'; go('/drafting'); toast(`Re-drafting #${d.id}`, 'info'); } });
    root.querySelector('#ed-save').onclick = (e) => {
      const left = PH.filter(([k]) => !root.querySelector('#ph-' + k).value.trim()).length;
      busy(e.currentTarget, () => {
        D.documents.unshift({ id: nextId(D.documents), name: `${draftTitle(d)} (draft ${d.id}).docx`, cat: 'Draft', caseId: c.id, client: c.client, ext: 'docx', kb: 96, version: 1, shared: false, date: new Date(), by: D.me.name, status: 'Active' });
        toast(`Saved to ${esc(c.no)}${left ? `. ${left} placeholder${left > 1 ? 's are' : ' is'} still empty.` : ''}`, left ? 'warn' : 'ok', { action: { label: 'Open case', href: '#/cases/' + c.id } });
      });
    };

    /* Ask Lisa */
    const chat = root.querySelector('#chat');
    const ask = (text, key) => {
      chat.insertAdjacentHTML('beforeend', `<div class="pp-msg me">${esc(text)}</div>`);
      const pend = document.createElement('div'); pend.className = 'pp-msg ai faint'; pend.innerHTML = '<span class="pp-spin" aria-hidden="true"></span> Lisa is reading the draft'; chat.append(pend);
      chat.lastElementChild.scrollIntoView({ block: 'nearest' });
      setTimeout(() => {
        const pr = PROPOSALS[key] || PROPOSALS.other; const pid = uid('pr');
        pend.className = 'pp-msg ai';
        pend.innerHTML = `<div>${esc(pr.say)}</div><div class="faint xs" style="margin:8px 0 4px">Paragraph ${pr.pid}</div><div style="line-height:1.6"><span class="pp-del">${esc(pr.old)}</span> <span class="pp-add">${esc(pr.nw)}</span></div>
          <div class="row" style="margin-top:10px" id="${pid}"><button class="btn primary sm" data-acc>${I('check', 'sm')}Accept</button><button class="btn ghost sm" data-rej>Reject</button></div>`;
        const bar = pend.querySelector('#' + pid);
        bar.querySelector('[data-acc]').onclick = () => {
          const el = para(pr.pid);
          if (!el || !el.innerHTML.includes(esc(pr.old).replace(/&#39;/g, '\''))) { toast('That paragraph has changed since Lisa read it. Ask again.', 'warn'); return; }
          el.innerHTML = el.innerHTML.replace(esc(pr.old).replace(/&#39;/g, '\''), esc(pr.nw).replace(/&#39;/g, '\''));
          bar.innerHTML = `<span class="chip ok">Accepted</span>`; flash(el); toast(`Paragraph ${pr.pid} updated`);
        };
        bar.querySelector('[data-rej]').onclick = () => { bar.innerHTML = '<span class="chip">Rejected</span>'; };
        pend.scrollIntoView({ block: 'nearest' });
      }, 900);
    };
    root.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => ask(b.dataset.preset, b.dataset.preset));
    root.querySelector('#chat-f').addEventListener('submit', e => { e.preventDefault(); const i = root.querySelector('#chat-in'); const v = i.value.trim(); if (!v) { i.focus(); return; } i.value = ''; ask(v, 'other'); });

    /* Review */
    root.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => flash(para(b.dataset.goto)));
    root.querySelector('#pb-run').onclick = (e) => busy(e.currentTarget, () => {
      const pb = D.playbooks.find(x => x.id === +root.querySelector('#pb-sel').value);
      const out = root.querySelector('#pb-out');
      out.innerHTML = `<div class="row between" style="margin-bottom:8px"><span class="small">Checked against <b>${esc(pb.name)}</b></span>${chip('Negotiate', 'warn')}</div>
        <div class="table-wrap"><table class="t"><thead><tr><th scope="col">Severity</th><th scope="col">Issue and suggestion</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>${RISKS.map(([s, iss, sug], i) => `<tr data-risk="${i}"><td>${chip(s)}</td><td><div class="small">${esc(iss)}</div><div class="faint xs" style="margin-top:4px">${esc(sug)}</div></td><td><div class="stack" style="gap:4px"><button class="btn sm" data-racc>Accept</button><button class="btn ghost sm" data-rdis>Dismiss</button></div></td></tr>`).join('')}</tbody></table></div>`;
      out.querySelectorAll('[data-risk]').forEach(tr => {
        tr.querySelector('[data-racc]').onclick = () => { tr.lastElementChild.innerHTML = chip('Accepted', 'ok'); toast('Suggestion added to the review notes'); };
        tr.querySelector('[data-rdis]').onclick = () => { tr.remove(); toast('Dismissed', 'info'); };
      });
    }, 1100);
  },
});

function openPlaybook(pb, redraw) {
  drawer({
    title: esc(pb.name), sub: `${esc(pb.category)}, built from ${pb.sources} documents`, wide: true,
    body: pb.clauses.length ? pb.clauses.map((c, i) => `<details class="pp-acc" ${i === 0 ? 'open' : ''} data-cl="${i}"><summary>${I('chevron', 'sm chev')}<b>${esc(c.type)}</b><span class="faint xs" style="margin-left:auto">${c.red.length} red line${c.red.length === 1 ? '' : 's'}</span></summary>
        <div class="stack" style="padding:0 0 18px 26px;gap:14px">
          ${field({ id: `pb-s${i}`, label: 'Standard position', type: 'textarea', rows: 2, value: c.standard })}
          <div><div class="label" style="margin-bottom:6px">Red lines</div><div class="stack" style="gap:6px" data-reds="${i}">${c.red.map((r, j) => `<div class="row"><span class="grow small" style="padding:6px 10px;border:1px solid var(--line);border-left:3px solid var(--tape);border-radius:var(--r-sm)">${esc(r)}</span><button type="button" class="btn ghost sm icon" data-rmred="${i}:${j}" aria-label="Remove red line">${I('x', 'sm')}</button></div>`).join('')}</div>
            <div class="row" style="margin-top:6px"><label class="sr-only" for="pb-nr${i}">New red line</label><input class="input grow" id="pb-nr${i}" placeholder="Add a red line"><button type="button" class="btn sm" data-addred="${i}">${I('plus', 'sm')}Add</button></div></div>
          ${field({ id: `pb-f${i}`, label: 'Fallback positions', type: 'textarea', rows: 2, value: c.fallback.join('\n'), hint: 'One per line, in order of preference.' })}
          ${field({ id: `pb-n${i}`, label: 'Notes', type: 'textarea', rows: 2, value: c.notes || '', placeholder: 'When to escalate, who approves' })}
        </div></details>`).join('')
      : emptyState({ icon: 'shield', title: 'Still reading the source documents', text: 'Clauses appear here when processing finishes.' }),
    foot: `<button class="btn ghost" data-close>Close</button>${pb.clauses.length ? '<button class="btn primary" id="pb-save">Save playbook</button>' : ''}`,
    onMount(el, close) {
      const reread = () => pb.clauses.forEach((c, i) => { c.standard = el.querySelector('#pb-s' + i).value.trim(); c.fallback = el.querySelector('#pb-f' + i).value.split('\n').map(s => s.trim()).filter(Boolean); c.notes = el.querySelector('#pb-n' + i).value.trim(); });
      const drawReds = (i) => { el.querySelector(`[data-reds="${i}"]`).innerHTML = pb.clauses[i].red.map((r, j) => `<div class="row"><span class="grow small" style="padding:6px 10px;border:1px solid var(--line);border-left:3px solid var(--tape);border-radius:var(--r-sm)">${esc(r)}</span><button type="button" class="btn ghost sm icon" data-rmred="${i}:${j}" aria-label="Remove red line">${I('x', 'sm')}</button></div>`).join(''); };
      el.addEventListener('click', e => {
        const rm = e.target.closest('[data-rmred]'); const ad = e.target.closest('[data-addred]');
        if (rm) { const [i, j] = rm.dataset.rmred.split(':').map(Number); pb.clauses[i].red.splice(j, 1); drawReds(i); }
        if (ad) { const i = +ad.dataset.addred; const inp = el.querySelector('#pb-nr' + i); const v = inp.value.trim(); if (!v) { inp.focus(); return; } pb.clauses[i].red.push(v); inp.value = ''; drawReds(i); inp.focus(); }
      });
      const sv = el.querySelector('#pb-save'); if (sv) sv.onclick = (e) => busy(e.currentTarget, () => { reread(); close(); redraw(); toast(`Saved ${esc(pb.name)}`); });
    },
  });
}

const PW_RULES = [
  ['len', '8 to 32 characters', v => v.length >= 8 && v.length <= 32],
  ['low', 'A lowercase letter', v => /[a-z]/.test(v)],

}

/* New + confirm password block with live rules, strength meter and match indicator */
function pwBlock(p) {
  return `${pwField({ id: p + '-new', label: 'New password', err: 'Meet every rule below.' })}
    <div class="stack" style="gap:8px"><div class="meter" aria-hidden="true"><i id="${p}-meter"></i></div>
      <div class="row between xs"><span class="faint">Strength</span><b id="${p}-str" class="xs" aria-live="polite">Too short</b></div>
      <ul class="pw-rules" id="${p}-rules" style="list-style:none;margin:0;padding:0" aria-label="Password rules">${PW_RULES.map(([k, l]) => `<li data-r="${k}" class="row" style="gap:6px">${I('minus', 'sm')}<span>${l}</span></li>`).join('')}</ul></div>
    ${pwField({ id: p + '-conf', label: 'Confirm new password', err: 'The two passwords don\'t match. Type the same password in both boxes.' })}
    <div id="${p}-match" class="xs" aria-live="polite" style="min-height:18px;margin-top:-8px"></div>`;
}
function wirePwBlock(root, p, onChange) {
  const n = root.querySelector(`#${p}-new`); const c = root.querySelector(`#${p}-conf`);
  const check = () => {
    const v = n.value; let score = 0;
    PW_RULES.forEach(([k, , fn]) => { const ok = fn(v); if (ok) score++; const li = root.querySelector(`#${p}-rules [data-r="${k}"]`); li.classList.toggle('ok', ok); li.querySelector('svg').outerHTML = I(ok ? 'check' : 'minus', 'sm'); });
    const [lbl, col] = !v ? ['Too short', 'var(--ink-3)'] : score <= 2 ? ['Weak', 'var(--bad)'] : score <= 4 ? ['Fair', 'var(--warn)'] : ['Strong', 'var(--ok)'];
    const m = root.querySelector(`#${p}-meter`); m.style.width = (score / 5 * 100) + '%'; m.style.background = col;
    const s = root.querySelector(`#${p}-str`); s.textContent = lbl; s.style.color = col;
    const mt = root.querySelector(`#${p}-match`);
    mt.innerHTML = !c.value ? '' : c.value === v ? `<span class="row" style="gap:4px;color:var(--ok)">${I('ok', 'sm')}Passwords match</span>` : `<span class="row" style="gap:4px;color:var(--bad)">${I('warn', 'sm')}Passwords don't match yet</span>`;
    const valid = score === 5 && c.value === v;
    onChange && onChange(valid);
    return valid;
  };
  n.addEventListener('input', check); c.addEventListener('input', check);
  check();
  return check;
}

page('/verify', {
  title: 'Verify code', public: true, bare: true,
  render: () => authFrame(`
    <a class="link small" href="#/forgot">Back</a>
    <h1 style="margin-top:16px">Enter verification code</h1>
    <p class="muted" style="margin-bottom:24px">Type the 6-digit code we sent to <b class="mono">${esc(maskEmail(pendingResetEmail))}</b>.</p>
    <form id="vf" class="stack" novalidate>
      <fieldset style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">Verification code</legend>
        <div class="otp" id="otp">${Array.from({ length: 6 }, (_, i) => `<input class="input" inputmode="numeric" autocomplete="${i ? 'off' : 'one-time-code'}" maxlength="1" aria-label="Digit ${i + 1} of 6">`).join('')}</div></fieldset>
      <div id="v-alert" aria-live="assertive"></div>
      <button class="btn primary pp-full" id="v-go" type="submit">Verify code</button>
      <p class="small muted" id="v-resend" aria-live="polite"></p>
    </form>`),
  mount(root) {
    updateThemeBtn();
    const ins = [...root.querySelectorAll('#otp input')];
    const fill = (digits, from = 0) => { digits.split('').forEach((d, k) => { if (ins[from + k]) ins[from + k].value = d; }); (ins[Math.min(from + digits.length, 5)]).focus(); };
    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => { const d = inp.value.replace(/\D/g, ''); if (d.length > 1) { fill(d.slice(0, 6 - i), i); return; } inp.value = d; if (d && i < 5) ins[i + 1].focus(); });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && i > 0) { ins[i - 1].value = ''; ins[i - 1].focus(); e.preventDefault(); }
        if (e.key === 'ArrowLeft' && i > 0) ins[i - 1].focus();
        if (e.key === 'ArrowRight' && i < 5) ins[i + 1].focus();
      });
      inp.addEventListener('paste', e => { e.preventDefault(); const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (d) fill(d, 0); });
      inp.addEventListener('focus', () => inp.select());
    });
    setTimeout(() => ins[0].focus(), 30);
    // Resend link with a 30 second cool-down
    const rs = root.querySelector('#v-resend'); let t;
    const countdown = () => { let n = 30; clearInterval(t); const tick = () => { if (!document.body.contains(rs)) return clearInterval(t); if (n <= 0) { clearInterval(t); rs.innerHTML = `Didn't get it? <button type="button" class="link" style="border:0;background:none;padding:0" id="v-again">Send a new code</button>`; rs.querySelector('#v-again').onclick = () => { toast('New code sent to ' + esc(maskEmail(pendingResetEmail)), 'info'); countdown(); }; return; } rs.textContent = `You can request a new code in ${n--} s.`; }; tick(); t = setInterval(tick, 1000); };
    countdown();
    root.querySelector('#vf').addEventListener('submit', e => {
      e.preventDefault();
      const code = ins.map(x => x.value).join(''); const al = root.querySelector('#v-alert');
      if (code.length < 6) { al.innerHTML = `<div class="callout bad">${I('warn')}<div>Enter all 6 digits of the code.</div></div>`; ins.find(x => !x.value).focus(); return; }
      busy(root.querySelector('#v-go'), () => {
        if (code === '000000') { al.innerHTML = `<div class="callout bad">${I('warn')}<div>That code is wrong or expired. Request a new one.</div></div>`; ins.forEach(x => { x.value = ''; x.setAttribute('aria-invalid', 'true'); }); ins[0].focus(); return; }
        clearInterval(t); go('/reset');
      });
    });
  },
});

    title: `Creating ${name === 'Full' ? 'a full' : name.toLowerCase() + ' only'} backup`, sub: 'You can keep working. Closing this window doesn\'t stop the backup.', size: 'narrow',
    body: `<div class="pp-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Backup progress"><i id="bk-bar"></i></div>
      <div class="row between xs faint" style="margin-top:6px"><span id="bk-step" aria-live="polite">Preparing…</span><span id="bk-pc" class="num">0%</span></div>
      <div class="pp-steps">${secs.map((s, i) => `<div data-i="${i}">${I('clock', 'sm')}<span class="grow">${s}</span><span class="xs num"></span></div>`).join('')}</div>`,
    foot: '<button class="btn ghost" data-close>Run in background</button>',
    onMount(el, close) {
      let p = 0; const per = 100 / secs.length; const started = Date.now();
      const iv = setInterval(() => {
        if (!document.body.contains(el)) { clearInterval(iv); }
        p = Math.min(100, p + 4 + Math.random() * 6);
        const idx = Math.min(secs.length - 1, Math.floor(p / per));
        el.querySelectorAll('.pp-steps > div').forEach((d, i) => { const done = p >= 100 || i < idx; d.className = done ? 'done' : i === idx ? 'on' : ''; d.querySelector('svg').outerHTML = I(done ? 'ok' : i === idx ? 'refresh' : 'clock', 'sm'); if (done && !d.dataset.t) { d.dataset.t = 1; d.querySelector('.num').textContent = Math.max(1, Math.round((Date.now() - started) / 400)) + 's'; } });
        el.querySelector('#bk-bar').style.width = p + '%'; el.querySelector('[role=progressbar]').setAttribute('aria-valuenow', Math.round(p));
        el.querySelector('#bk-pc').textContent = Math.round(p) + '%'; el.querySelector('#bk-step').textContent = p >= 100 ? 'Finishing up' : 'Backing up ' + secs[idx].toLowerCase();
        if (p >= 100) {
          clearInterval(iv);
          D.backups.unshift({ id: Math.max(...D.backups.map(b => b.id)) + 1, at: new Date(), type: name, size: size.replace('≈ ', ''), dur: Math.round((Date.now() - started) / 1000) + 's', health: 100, status: 'Completed', sections: secs.map(s => [s, 'Completed', '—']) });
          setTimeout(() => { close(); toast(`${name} backup completed (${size.replace('≈ ', '')})`, 'ok'); if (currentPath() === '/backup') router(); }, 500);
        }
      }, 260);
    },
  });
}

  return `<div class="portal">
