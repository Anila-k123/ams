# AMS continuous integration (Phase 0 safety baseline).
#
# Checks only - nothing is deployed. Every job runs against throw-away services:
# the PostgreSQL container below exists only for the run, uses test-only
# credentials, and has no route to the office database, live file storage or
# any production AI key. No repository secrets are used.
name: CI

on:
  pull_request:
    branches: [main, dev3]
  push:
    branches: [main, dev3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django checks + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # pgvector build of PostgreSQL 18 (the office server runs 18.1; drafting needs pgvector).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only_password
          POSTGRES_DB: ams_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_user -d ams_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: Advocate-app-BE-Django
    env:
      # Test-only, non-secret configuration. python-decouple reads these from the
      # environment, so no .env file is needed (and none is ever committed).
      SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DEBUG: 'True'
      DB_NAME: ams_ci
      DB_USER: ci_user
      DB_PASSWORD: ci_test_only_password
      DB_HOST: localhost
      DB_PORT: '5432'
      ALLOWED_HOSTS: localhost,127.0.0.1
      MAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      MAIL_USERNAME: ''
      MAIL_PASSWORD: ''
      # No AI keys: an accidental model call fails instead of reaching a provider.
      LLM_PROVIDER: local
      LLM_BASE_URL: http://127.0.0.1:9
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      DRAFTING_GEMINI_API_KEY: ''
      DRAFTING_ANTHROPIC_API_KEY: ''
      DRAFTING_OPENAI_API_KEY: ''
      DRAFTING_SARVAM_API_KEY: ''
      DRAFTING_GOOGLE_TRANSLATE_API_KEY: ''
      COURT_API_BASE: http://127.0.0.1:9
      DOCUMENT_UPLOAD_DIR: /tmp/ams-ci-uploads
      DRAFTING_MEDIA_ROOT: /tmp/ams-ci-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Advocate-app-BE-Django/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Missing migrations (report only until the known drift is triaged)
        run: python manage.py makemigrations --check --dry-run || echo "::warning::Model changes without migrations - see output above"
      - name: Backend tests
        run: python manage.py test --noinput -v 1

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Advocate-app-FE-main
    env:
      VITE_API_BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Advocate-app-FE-main/package-lock.json
      - run: npm ci
      - name: Lint (0 warnings)
        run: npm run lint -- --max-warnings 0
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: npm run build

  dependency-audit:
    name: Dependency security report (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm audit (production dependencies)
        working-directory: Advocate-app-FE-main
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit found high/critical issues (fixed in Phase 1)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit (backend requirements)
        working-directory: Advocate-app-BE-Django
        run: |
          python -m pip install pip-audit==2.7.3
          pip-audit -r requirements.txt --progress-spinner off || echo "::warning::pip-audit reported vulnerable packages"
